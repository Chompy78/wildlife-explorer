name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight at a time; never cancel one that's already running (avoids leaving Pages on a
# half-deployed state), so a fast follow-up push queues behind it instead of racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Full check (typecheck + tests + build + encoding audit), not just a build - never deploy
      # something the check.yml CI would have rejected. This produces dist/ as its last step.
      - run: npm run check
      # enablement: true works around a chicken-and-egg problem on a brand-new Pages setup - this action
      # calls GET /repos/{owner}/{repo}/pages to read the site config, which 404s ("Not Found") until
      # something has explicitly created it. This tells the action to enable Pages itself if needed
      # instead of just failing.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
